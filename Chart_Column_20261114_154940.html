<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f3f5f9;--card:#ffffff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--soft:#f8fafc;--acc:#4f6bed;--accSoft:rgba(79,107,237,.12);--shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.08);}
body.dark{--bg:#0e1116;--card:#171b22;--ink:#e6e8ec;--mute:#9aa3b2;--line:#2a303b;--soft:#1e232c;--acc:#7c93ff;--accSoft:rgba(124,147,255,.16);--shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;transition:background .2s}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px 12px;position:relative}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hdr .t{min-width:0;flex:1 1 260px}
h1{font-size:21px;font-weight:650;margin:0;letter-spacing:-.01em;line-height:1.25}
.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb{height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:inherit;font-size:12.5px;transition:background .15s,border-color .15s}
.tb:hover{background:var(--soft);border-color:var(--acc)}
.tb.on{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 2px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;border-left:3px solid var(--acc)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.kpi .v{font-size:19px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#chart{width:100%;height:520px;margin-top:8px}
.ftr{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;gap:10px;flex-wrap:wrap}
.card.fs{position:fixed;inset:0;border-radius:0;z-index:50;overflow:auto;border:0}
.card.fs #chart{height:calc(100vh - 220px);min-height:320px}
.panel{position:fixed;top:0;right:0;height:100%;width:350px;max-width:94vw;background:var(--card);color:var(--ink);border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .22s ease;z-index:60;display:flex;flex-direction:column}
.panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph b{font-size:15px}
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer;text-align:center;font:inherit;font-size:12.5px;color:var(--ink)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{padding:6px 16px 22px;overflow:auto;flex:1}
.sec{display:none}.sec.on{display:block}
.row{margin:14px 0}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
select,input[type=number],input[type=text]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:0 10px;font:inherit;font-size:13px}
select:focus,input:focus{outline:2px solid var(--accSoft);border-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;height:32px;border:0;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;font-size:12px;border-right:1px solid var(--line);padding:0 4px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer}
.sw input{width:38px;height:20px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:20px;position:relative;cursor:pointer;transition:.2s;flex:none;margin:0}
.sw input:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked{background:var(--acc)}
.sw input:checked:before{left:20px}
.sw.dis{opacity:.45;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--acc)}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{display:flex;flex-direction:column;gap:5px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--ink);font:inherit;font-size:11.5px;text-align:left}
.pal button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--accSoft)}
.pal i{display:flex;height:10px;border-radius:3px;overflow:hidden}
.pal i span{flex:1}
.btnp{height:36px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer;padding:0 16px}
.btng{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;padding:0 14px}
.full{width:100%}
.hint{font-size:11.5px;color:var(--mute);margin-top:5px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.ov.open{display:flex}
.md{background:var(--card);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);width:min(780px,100%);max-height:86vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.md.sm{width:min(440px,100%)}
.mb{padding:14px 18px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--soft);font-weight:600}
tfoot td{font-weight:700;background:var(--soft)}
tbody tr:hover td{background:var(--accSoft)}
.dd{position:relative}
.menu{position:absolute;right:0;top:40px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none;z-index:40;min-width:220px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:#111827;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.capture .tools{visibility:hidden}
@media (max-width:760px){.wrap{padding:10px}.card{padding:14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}#chart{height:420px}.tb span{display:none}}
@media print{.tools,.panel,.ov,.toast{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>
</head>

  h += '</tr>';

 h += '</tbody><tfoot><tr><td>Total</td>';
 vkAll.forEach(function(k){ h += '<td>' + (ser[k].pct ? pctStr(colT[k]/Math.max(1,cats.length)*100,S.dec) + ' avg' : fmt(colT[k],'raw',S.dec,sym())) + '</td>'; });
 if (money>1) h += '<td>' + fmt(grand,'raw',S.dec,sym()) + '</td>';
 return h + '</tr></tfoot></table>';
}
function rows(sep){
 var q = function(s){ s=String(s); return (sep===',' && /[",\n]/.test(s)) ? '"' + s.replace(/"/g,'""') + '"' : s; };
 var out = [ [q(chartType()==='bar' ? (S.yName||'Category') : (S.xName||'Category'))].concat(ser.map(function(s){return q(s.name);})).join(sep) ];
 order.forEach(function(i){ out.push([q(cats[i])].concat(ser.map(function(s){ return num(s.data[i]); })).join(sep)); });
 return out.join('\r\n');
}
function download(data, name, type){
 var blob = (data instanceof Blob) ? data : new Blob([data], {type:type});
 var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
 setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function baseName(){ return String(C.file || 'Chart').replace(/\.html?$/i,''); }
function saveHtml(){
 var st = JSON.stringify(S).replace(/</g,'\\u003c');
 var a1 = '/*XLB_' + 'STATE*/', a2 = '/*END_' + 'STATE*/';
 var i1 = XLB_SRC.indexOf(a1), i2 = XLB_SRC.indexOf(a2, i1);
 if (i1 < 0 || i2 < 0) { toast('Could not save'); return; }
 var out = XLB_SRC.slice(0, i1 + a1.length) + st + XLB_SRC.slice(i2);
 out = out.replace(/<title>[\s\S]*?<\/title>/, function(){ return '<title>' + esc(S.title) + '</title>'; });
 download(out, baseName() + '.html', 'text/html');
 toast('Saved - open the downloaded file to keep your changes');
}
function pngChart(){
 var u = chart.getDataURL({ pixelRatio:2, backgroundColor:css('--card') });
 var a = document.createElement('a'); a.href = u; a.download = baseName() + '_chart.png'; a.click();
}
function pngCard(){
 if (typeof html2canvas !== 'function') { pngChart(); return; }
 var c = $('card'); c.classList.add('capture');
 html2canvas(c, { backgroundColor:css('--card'), scale:2, useCORS:true }).then(function(cv){
  c.classList.remove('capture'); var a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = baseName() + '.png'; a.click();
 }).catch(function(){ c.classList.remove('capture'); pngChart(); });
}
function copyText(t){
 if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){toast('Copied - paste into Excel');}, fallback); else fallback();
 function fallback(){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('Copied');}catch(e){} ta.remove(); }
}
function closeAll(){ $('panel').classList.remove('open'); $('mExport').classList.remove('open'); [].forEach.call(document.querySelectorAll('.ov'), function(o){o.classList.remove('open');}); }

// ---------- wiring ----------
function init(){
 document.body.classList.toggle('dark', S.theme==='dark');
 chart = echarts.init($('chart'), null, { renderer:'canvas' });
 buildPal();
 $('bLabels').onclick = function(){ openPanel('sLab'); };
 $('bOpts').onclick = function(){ openPanel('sCh'); };
 $('bSort').onclick = function(){ var seq=['orig','desc','asc','az']; S.sort = seq[(seq.indexOf(S.sort)+1)%seq.length]; render(); syncPanel(); toast('Sorted: ' + {orig:'Original order',desc:'High to Low',asc:'Low to High',az:'A to Z'}[S.sort]); };
 $('bStack').onclick = function(){ S.mode = S.mode==='group' ? 'stack' : 'group'; render(); syncPanel(); toast(S.mode==='stack' ? 'Stacked' : 'Grouped'); };
 $('bTable').onclick = function(){ $('tblT').textContent = S.title || 'Data'; $('tblBox').innerHTML = tableHtml(); $('ovTable').classList.add('open'); };
 $('bEdit').onclick = function(){ $('eTitle').value=S.title; $('eSub').value=S.sub; $('eX').value=S.xName; $('eY').value=S.yName; $('ovEdit').classList.add('open'); $('eTitle').focus(); };
 $('eApply').onclick = function(){ S.title=$('eTitle').value; S.sub=$('eSub').value; S.xName=$('eX').value; S.yName=$('eY').value; closeAll(); render(); };
 $('bTheme').onclick = function(){ S.theme = S.theme==='dark' ? 'light' : 'dark'; render(); };
 $('bFull').onclick = function(){ $('card').classList.toggle('fs'); setTimeout(function(){ chart.resize(); render(); }, 60); };
 $('bExport').onclick = function(e){ e.stopPropagation(); $('mExport').classList.toggle('open'); };
 $('mExport').onclick = function(e){ var b=e.target.closest('button'); if(!b) return; $('mExport').classList.remove('open'); var x=b.getAttribute('data-x');
  if (x==='html') saveHtml(); else if (x==='png') pngCard(); else if (x==='pngc') pngChart(); else if (x==='csv') download('\uFEFF' + rows(','), baseName() + '.csv', 'text/csv;charset=utf-8'); else if (x==='print') window.print(); };
 $('bCopy').onclick = function(){ copyText(rows('\t')); };
 $('bCsv').onclick = function(){ download('\uFEFF' + rows(','), baseName() + '.csv', 'text/csv;charset=utf-8'); };
 [].forEach.call(document.querySelectorAll('[data-close]'), function(b){ b.addEventListener('click', function(){ var t=$(b.getAttribute('data-close')); t.classList.remove('open'); }); });
 [].forEach.call(document.querySelectorAll('.ov'), function(o){ o.addEventListener('click', function(e){ if (e.target===o) o.classList.remove('open'); }); });
 [].forEach.call(document.querySelectorAll('.tab'), function(t){ t.addEventListener('click', function(){ openPanel(t.getAttribute('data-tab')); }); });
 document.addEventListener('click', function(e){ if (!e.target.closest('.dd')) $('mExport').classList.remove('open'); });
 document.addEventListener('keydown', function(e){ if (e.key==='Escape') { if ($('card').classList.contains('fs') && !document.querySelector('.ov.open,.panel.open')) { $('card').classList.remove('fs'); setTimeout(render,60); } closeAll(); } });
 chk('lShow','lblShow'); sel('lFmt','lblFmt'); seg('lDec','dec'); sel('lPos','lblPos'); rng('lSize','lblSize','lSizeV','px');
 chk('lBold','lblBold'); chk('lCur','lblCur'); chk('lRot','lblRot'); chk('lZero','lblZero'); chk('lTot','stackTot');
 seg('cSort','sort'); seg('cMode','mode'); seg('cLeg','legend');
 chk('cAvg','avg'); chk('cMax','maxmin'); chk('cKpi','kpi'); chk('cGrid','grid'); chk('cZoom','zoom');
 $('cTarget').addEventListener('input', function(){ S.target = this.value; clearTimeout(this._t); this._t = setTimeout(render, 250); });
 rng('cH','h','cHV','px'); chk('cRound','round'); chk('cGrad','grad'); chk('cTrack','track'); rng('cW','width','cWV','%');
 $('cReset').onclick = function(){ S = clone(D); keepZoom = null; render(); syncPanel(); toast('All changes reset'); };
 chart.on('legendselectchanged', function(e){ S.sel = e.selected; render(); });
 chart.on('datazoom', function(){ var o=chart.getOption(); if (o.dataZoom && o.dataZoom[0]) keepZoom = [o.dataZoom[0].start, o.dataZoom[0].end]; });
 var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ chart.resize(); render(); }, 120); });
 if (window.ResizeObserver) new ResizeObserver(function(){ chart.resize(); }).observe($('chart'));
 render();
}
if (typeof echarts === 'undefined') { document.getElementById('chart').innerHTML = '<div style="padding:40px;text-align:center;color:#888">Chart library could not load. Please check your internet connection and reopen this file.</div>'; }
else init();
})();
</script>
